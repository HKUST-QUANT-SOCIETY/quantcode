      - "factor_engine.runtime.engine.FactorEngine + backend.factory.build_backend('auto')（SQL 下推→Polars→Pandas）"
      - "storage.factory.build_data_source(type='data_access') 直连数据层；FactorEngine.run_from_config(yaml)；service/ HTTP（factor-engine-serve）"
    when_to_use: "把因子公式（DSL）算成 (日期×标的) 因子值并落因子湖；批量算子表达式计算"
    when_not_to_reinvent: "别手写向量化因子计算管线、别再造算子库——DSL 已有 460+ 算子；它不做数据清洗/评估/回测（各归其库）"
    owner_group: factor
    source_commit: "c374cbd"
    distilled_at: "2026-09-01"

