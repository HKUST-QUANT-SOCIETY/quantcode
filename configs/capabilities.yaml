# configs/capabilities.yaml — P-07 组织资产蒸馏：能力卡片单源（不走 db）。
#
# 来源纪律：**禁止凭会议记忆手写卡片**——每张卡的内容以 docs/audit/ASSET_INVENTORY.md
# 的 Step 0 实读（gh repo view + README，2026-09-01）为准；更新卡片须同步更新调研文档。
# 蒸馏粒度守则：蒸 API 面（入口模块/门面/契约类型名），不蒸实现细节；
# 数据字段清单（data_access semantic_fields 56 字段）与部署底层结构（alpha_flow 模块内部）
# 不进卡片正文——细节走属组 scope Memory（弱保证），常驻摘要只有 id+name+when_to_use（强保证）。
#
# schema：schemas/capability_card.py::CapabilityCard（extra=forbid）+ schemas/capability-card.schema.json。
# 加载：runner/distill/cards.py（经 runner/config_loader.load_yaml，QUANTCODE_CONFIG_DIR 可覆盖）。
#
# 复用纪律（运行时指令，runner/distill/inject.py 注入）：需求识别到已有能力覆盖不全
# → 先向人征询，不许直接跳自造方案。strict_reuse=true 时进一步禁止引入外部自造实现
# （仅允许已登记能力）——默认 false（P0 只注入纪律提示，不做硬拦截，收窄由主 Agent 裁决）。
# Local dev/test may opt out for fixture-only runs. Production runtime forces
# this policy on even if a stale config still contains false.
strict_reuse: false

# 常驻摘要注入开关与限长（runner/distill/inject.py）。
inject_enabled: true
digest_max_chars: 2000

cards:
  # ── 契约卡（contract）：全组织可见（含游客组）──────────────────────────────
  - id: target-return-view-v1
    name: 目标收益口径契约（TargetReturnView/v1）
    type: contract
    canonical_repo: quantcode
    domain_authority: data-contract
    visibility: global_shared
    maturity_status: PRODUCTION
    integration_status: PARTIAL
    observed_at: "2026-09-04"
    api_surface:
      - "schemas/data_contracts.py::TargetReturnView/v1 — horizon∈{1,5,10,20}、adjusted=hfq（后复权）、alignment=t+1→t+2"
      - "唯一取值源 = 数据仓目标收益表（后复权表）；本契约只登记口径，不定义计算"
    when_to_use: "任何涉及目标收益 / 前向标签的计算与评估前，先取本契约口径（Horizon/复权/对齐）"
    when_not_to_reinvent: "禁止自算目标收益（实测有组员把 t+1→t+2 算成 t→t+1 致收益虚高）；禁止未复权口径；禁止 Horizon∈{1,5,10,20} 之外的窗口自造"
    owner_group: all
    # in-repo 契约（本仓 feat/p0-production-readiness 分支 schemas/data_contracts.py，AG-B 落地），
    # 铁律禁 git 操作 → source_commit 留空，以分支标注。
    source_commit: ""
    distilled_at: "2026-09-01"

  # ── 资产卡（asset）：org 真实仓库蒸馏；细节落属组 Memory groups scope ────────
  - id: quant-evaluator
    name: Quant Evaluator 批量因子评估器
    type: asset
    canonical_repo: quant_evaluator
    domain_authority: factor-evaluation
    visibility: group
    maturity_status: PRODUCTION
    integration_status: PARTIAL
    observed_at: "2026-09-04"
    api_surface:
      - "quant_evaluator.api：EvaluationRequest / EvaluationBundle / evaluate()（评估唯一入口）"
      - "quant_evaluator.contracts.label_bundle.LabelBundle — 显式前向标签，硬口径 price_convention='vwap_to_vwap'"
      - "指标注册表：docs/METRIC_REGISTRY_COVERAGE.csv 实测 60 个注册指标（spec v0.2 的 51 为旧口径）"
    when_to_use: "因子批量评估需要 IC / 分位数 / 回撤 / 换手 / 置信区间等指标时（F-06 组织评估能力登记）"
    when_not_to_reinvent: "别自写 rank_ic / quantile_spread / block_bootstrap_ci 等指标——注册表已覆盖；别自算 LabelBundle 的时序标签"
    owner_group: factor
    source_commit: "73223a4"
    distilled_at: "2026-09-01"

