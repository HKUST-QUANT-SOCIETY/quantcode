[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantcode"
version = "0.0.1"
description = "QuantCode — HKUST QUANT SOCIETY agent platform on OpenCode fork"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "HKUST QUANT SOCIETY — Agent Group" },
]
dependencies = [
  "pydantic>=2.6",
  "jsonschema>=4.20",
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite>=2.0",
  "langchain-openai>=0.3",
  "pyyaml>=6.0",
  "chromadb>=0.5",
  "pyarrow>=15.0",
  "packaging>=23.0",
  "json5>=0.9",
]

[project.optional-dependencies]
roster = ["openpyxl>=3.1"]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]
# P0-7（A09-04/05）：SSH 读各组主线服务器（runner/server_ssh.py）为可选能力，
# 不进核心依赖；缺包时读主线自动降级（match_main 静默跳过）。
ssh = [
  "paramiko>=3.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["quantcode*", "runner*", "tools*", "schemas*", "flows*"]
exclude = ["vendor*", "templates*", "docs*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
