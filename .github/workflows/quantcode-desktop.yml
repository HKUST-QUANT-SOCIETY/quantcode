name: QuantCode desktop installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without a leading v"
        required: false
        type: string
      publish:
        description: "Publish the installers to a GitHub Release"
        required: true
        default: false
        type: boolean
      sign:
        description: "Build signed/approved release artifacts without necessarily publishing"
        required: true
        default: false
        type: boolean

concurrency:
  group: quantcode-desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: frontend

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
      sign: ${{ steps.release.outputs.sign }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: frontend/package.json

      - id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_SIGN: ${{ inputs.sign }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#quantcode-v}"
            if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
              echo "Release tag $GITHUB_REF_NAME must point to a commit reachable from $DEFAULT_BRANCH" >&2
              exit 1
            fi
          else
            version="${INPUT_VERSION:-0.1.${GITHUB_RUN_NUMBER}}"
          fi

          publish="${INPUT_PUBLISH:-false}"
          sign="${INPUT_SIGN:-false}"
          if [[ "$publish" == "true" ]]; then sign=true; fi

          if [[ "$sign" == "true" && "$GITHUB_REF_TYPE" != "tag" && "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Signed release builds are restricted to tags or the default branch ($DEFAULT_BRANCH)" >&2
            exit 1
          fi

          {
            bun packages/desktop/scripts/release-version.ts "$version"
            echo "tag=quantcode-v$version"
            echo "publish=$publish"
            echo "sign=$sign"
          } >> "$GITHUB_OUTPUT"

  build_unsigned:
    needs: version
    if: needs.version.outputs.sign != 'true'
    permissions:
      contents: read
    name: Unsigned / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: --mac --x64
            install: --os=darwin --cpu=x64
          - name: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            platform: --mac --arm64
            install: --os=darwin --cpu=arm64
          - name: Windows x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            platform: --win --x64
            install: --os=win32 --cpu=x64
          - name: Linux x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: --linux --x64
            install: --os=linux --cpu=x64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./frontend/.github/actions/build-quantcode-desktop
        with:
          release_version: ${{ needs.version.outputs.version }}
          rust_target: ${{ matrix.target }}
          platform: ${{ matrix.platform }}
          install_flags: ${{ matrix.install }}
          signing_mode: unsigned
          update_feed: disabled

  build_signed_macos:
    needs: version
    if: needs.version.outputs.sign == 'true'
    name: Signed / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    environment: quantcode-release-macos
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: --mac --x64
            install: --os=darwin --cpu=x64
          - name: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            platform: --mac --arm64
            install: --os=darwin --cpu=arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./frontend/.github/actions/build-quantcode-desktop
        with:
          release_version: ${{ needs.version.outputs.version }}
          rust_target: ${{ matrix.target }}
          platform: ${{ matrix.platform }}
          install_flags: ${{ matrix.install }}
          signing_mode: signed
          update_feed: disabled
          apple_certificate: ${{ secrets.APPLE_CERTIFICATE }}
          apple_certificate_password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          apple_api_key_content: ${{ secrets.APPLE_API_KEY_CONTENT }}
          apple_api_key_id: ${{ secrets.APPLE_API_KEY_ID }}
          apple_api_issuer: ${{ secrets.APPLE_API_ISSUER }}

  build_signed_windows:
    needs: version
    if: needs.version.outputs.sign == 'true'
    name: Signed / Windows x64
    runs-on: windows-2025
    timeout-minutes: 75
    environment: quantcode-release-windows
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./frontend/.github/actions/build-quantcode-desktop
        with:
          release_version: ${{ needs.version.outputs.version }}
          rust_target: x86_64-pc-windows-msvc
          platform: --win --x64
          install_flags: --os=win32 --cpu=x64
          signing_mode: signed
          update_feed: disabled
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure_trusted_signing_account_name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          azure_trusted_signing_certificate_profile: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          azure_trusted_signing_endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          azure_trusted_signing_publisher_name: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}

  # Linux has neither a platform code-signing provider nor an independent
  # updater trust anchor in this workflow. Publish only after environment
  # approval, but compile the client with automatic updates disabled.
  build_release_linux:
    needs: version
    if: needs.version.outputs.sign == 'true'
    name: Release / Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: quantcode-release-linux
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./frontend/.github/actions/build-quantcode-desktop
        with:
          release_version: ${{ needs.version.outputs.version }}
          rust_target: x86_64-unknown-linux-gnu
          platform: --linux --x64
          install_flags: --os=linux --cpu=x64
          signing_mode: none
          update_feed: disabled

  finalize:
    needs:
      - version
      - build_unsigned
      - build_signed_macos
      - build_signed_windows
      - build_release_linux
    if: >-
      ${{ always() && needs.version.result == 'success' &&
          ((needs.build_unsigned.result == 'success' && needs.build_signed_macos.result == 'skipped' &&
            needs.build_signed_windows.result == 'skipped' && needs.build_release_linux.result == 'skipped') ||
           (needs.build_unsigned.result == 'skipped' && needs.build_signed_macos.result == 'success' &&
            needs.build_signed_windows.result == 'success' && needs.build_release_linux.result == 'success')) }}
    name: Finalize release bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: frontend/package.json

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: quantcode-*
          path: frontend/release-assets
          merge-multiple: true

      # Preserve the target directories expected by finalize-latest-yml.ts.
      # Do not set merge-multiple here: latest-mac.yml is emitted by both
      # macOS architectures and must be merged, not overwritten.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: latest-yml-*
          path: frontend/release-latest-yml

      - name: Validate release assets and finalize updater metadata
        env:
          LATEST_YML_DIR: release-latest-yml
          RELEASE_ASSET_DIR: release-assets
          FINALIZED_YML_DIR: release-finalized
          UPLOAD_RELEASE_METADATA: "false"
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          TARGET_REPOSITORY: HKUST-QUANT-SOCIETY/quantcode
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_SIGNED: ${{ needs.version.outputs.sign }}
          PUBLISH_REQUESTED: ${{ needs.version.outputs.publish }}
          RELEASE_UPDATE_FEED: disabled
          REQUIRED_TARGETS: aarch64-apple-darwin,x86_64-apple-darwin,x86_64-pc-windows-msvc,x86_64-unknown-linux-gnu
        run: bun packages/desktop/scripts/finalize-latest-yml.ts

      - name: Attest installer and metadata provenance
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            frontend/release-assets/*
            frontend/release-finalized/*

      - name: Upload finalized release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata
          if-no-files-found: error
          path: frontend/release-finalized/*

  release:
    needs:
      - version
      - build_signed_macos
      - build_signed_windows
      - build_release_linux
      - finalize
    if: >-
      ${{ always() && needs.version.outputs.publish == 'true' && needs.build_signed_macos.result == 'success' &&
          needs.build_signed_windows.result == 'success' && needs.build_release_linux.result == 'success' &&
          needs.finalize.result == 'success' }}
    runs-on: ubuntu-24.04
    concurrency:
      group: quantcode-release-${{ needs.version.outputs.tag }}
      cancel-in-progress: false
    environment: quantcode-release-publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: quantcode-*
          path: frontend/release-assets
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-metadata
          path: frontend/release-finalized

      - name: Verify approved release policy
        shell: bash
        run: |
          jq -e '
            .schemaVersion == 2 and
            .distribution.releaseClass == "approved-release" and
            .distribution.publishRequested == true and
            .distribution.updateFeed == "disabled" and
            .distribution.platformTrust.macos == "developer-id-notarized" and
            .distribution.platformTrust.windows == "azure-trusted-signing" and
            .distribution.platformTrust.linux == "approved-platform-unsigned"
          ' release-finalized/release-manifest.json >/dev/null

      - name: Stage draft GitHub Release
        id: stage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          TARGET_REPOSITORY: HKUST-QUANT-SOCIETY/quantcode
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "GitHub token is required to publish to $TARGET_REPOSITORY" >&2
            exit 1
          fi
          echo "already_published=false" >> "$GITHUB_OUTPUT"

          notes="$RUNNER_TEMP/quantcode-release-notes.md"
          printf 'Built from [%s@%s](https://github.com/%s/commit/%s).\n\nBuild run: https://github.com/%s/actions/runs/%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_SHA" \
            "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$notes"

          if gh release view "$TAG" --repo "$TARGET_REPOSITORY" >/dev/null 2>&1; then
            draft="$(gh release view "$TAG" --repo "$TARGET_REPOSITORY" --json isDraft --jq .isDraft)"
            existing_prerelease="$(gh release view "$TAG" --repo "$TARGET_REPOSITORY" --json isPrerelease --jq .isPrerelease)"
            if [[ "$existing_prerelease" != "$PRERELEASE" ]]; then
              echo "Existing release prerelease mode does not match the requested version" >&2
              exit 1
            fi
            if [[ "$draft" != "true" ]]; then
              echo "already_published=true" >> "$GITHUB_OUTPUT"
              echo "Release $TAG is already published; verification will determine whether this rerun is idempotent."
              exit 0
            fi
            gh release edit "$TAG" --repo "$TARGET_REPOSITORY" --title "QuantCode $VERSION" --notes-file "$notes"
          else
            flags=(--draft --target "$GITHUB_SHA")
            if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
            gh release create "$TAG" --repo "$TARGET_REPOSITORY" --title "QuantCode $VERSION" --notes-file "$notes" "${flags[@]}"
          fi

          if [[ "$(gh release view "$TAG" --repo "$TARGET_REPOSITORY" --json isDraft --jq .isDraft)" != "true" ]]; then
            echo "Release $TAG stopped being a draft before asset replacement" >&2
            exit 1
          fi

          mapfile -t stale < <(gh release view "$TAG" --repo "$TARGET_REPOSITORY" --json assets --jq '.assets[].name')
          for asset in "${stale[@]}"; do
            gh release delete-asset "$TAG" "$asset" --yes --repo "$TARGET_REPOSITORY"
          done

          mapfile -t files < <(find release-assets release-finalized -maxdepth 1 -type f -print | sort)
          if [[ "$(gh release view "$TAG" --repo "$TARGET_REPOSITORY" --json isDraft --jq .isDraft)" != "true" ]]; then
            echo "Release $TAG stopped being a draft before asset upload" >&2
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --repo "$TARGET_REPOSITORY"

      - name: Verify staged GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          TARGET_REPOSITORY: HKUST-QUANT-SOCIETY/quantcode
          ALREADY_PUBLISHED: ${{ steps.stage.outputs.already_published }}
        run: |
          expected="$RUNNER_TEMP/quantcode-release-expected.tsv"
          actual="$RUNNER_TEMP/quantcode-release-actual.tsv"

          while IFS= read -r file; do
            name="$(basename "$file")"
            size="$(stat --format=%s "$file")"
            digest="$(sha256sum "$file" | cut -d ' ' -f 1)"
            printf '%s\t%s\tsha256:%s\n' "$name" "$size" "$digest"
          done < <(find release-assets release-finalized -maxdepth 1 -type f -print | sort) | sort > "$expected"

          gh api "repos/$TARGET_REPOSITORY/releases/tags/$TAG" \
            --jq '.assets[] | [.name, (.size | tostring), (.digest // "")] | @tsv' | sort > "$actual"

          diff --unified "$expected" "$actual"
          draft="$(gh release view "$TAG" --repo "$TARGET_REPOSITORY" --json isDraft --jq .isDraft)"
          if [[ "$ALREADY_PUBLISHED" == "true" ]]; then
            [[ "$draft" == "false" ]]
          else
            [[ "$draft" == "true" ]]
          fi

      - name: Publish verified draft
        if: steps.stage.outputs.already_published != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          TARGET_REPOSITORY: HKUST-QUANT-SOCIETY/quantcode
        run: |
          flags=(--draft=false)
          if [[ "$PRERELEASE" != "true" ]]; then flags+=(--latest); fi
          gh release edit "$TAG" --repo "$TARGET_REPOSITORY" "${flags[@]}"
