name: Risk CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      scenario:
        description: "statistics_stub scenario fed to run_risk_ci_tool.py"
        required: false
        default: normal
        type: choice
        options:
          - normal
          - high_risk

permissions:
  contents: read
  issues: write
  pull-requests: write  # Required for posting PR comments via /issues/{number}/comments API

# Owner: 杨欣琳（T2 风控 / 跨组接收）
# 调用 .opencode/groups/risk/skills/risk-ci/SKILL.md
# 副作用（写 PR 评论）依赖 tools/utils/dedupe.py（陈镇鸿 Day 1 实现）
# 数据源是 statistics_stub 占位数据（非真实策略收益），step 名如实标注 "(stub data)"。
# dedupe 行为已有 tests/test_risk_dedupe.py 覆盖，不再在 CI 里重复跑第二遍验证。
# pull_request 触发行为不变：scenario 固定走默认 normal（inputs 上下文为空时回退 'normal'）。

jobs:
  risk-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          pip install -e .
          pip install jsonschema

      - name: Post risk profile comment (stub data)
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # 只在 pull_request 上发 GitHub 评论；手动 dispatch 仅跑本地 artifact 流程
          QUANTCODE_POST_RISK_COMMENT: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          PR_NUMBER: ${{ github.event.pull_request.number || '303' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || 'opencode1234567890abcdef' }}
          PR_URL: ${{ github.event.pull_request.html_url || '' }}
        run: >
          python scripts/run_risk_ci_tool.py
          --scenario ${{ inputs.scenario || 'normal' }}
          --pr-number "$PR_NUMBER"
          --head-sha "$HEAD_SHA"
          --pr-url "$PR_URL"
