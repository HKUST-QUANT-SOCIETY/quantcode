name: Risk Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write  # Required for posting PR comments via /issues/{number}/comments API

# Owner: 杨欣琳（T2 风控 / 跨组接收）
# 调用 .opencode/groups/risk/skills/risk-gate/SKILL.md
# 副作用（写 PR 评论）依赖 tools/utils/dedupe.py（陈镇鸿 Day 1 实现）

jobs:
  risk-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          pip install -e .
          pip install jsonschema

      - name: Post formal risk profile comment
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          QUANTCODE_POST_RISK_COMMENT: "1"
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: >
          python scripts/run_risk_gate_tool.py
          --scenario normal
          --pr-number "$PR_NUMBER"
          --head-sha "$HEAD_SHA"
          --pr-url "$PR_URL"

      - name: Repeat formal risk profile comment to verify dedupe
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          QUANTCODE_POST_RISK_COMMENT: "1"
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: >
          python scripts/run_risk_gate_tool.py
          --scenario normal
          --pr-number "$PR_NUMBER"
          --head-sha "$HEAD_SHA"
          --pr-url "$PR_URL"
